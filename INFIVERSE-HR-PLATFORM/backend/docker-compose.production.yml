# BHIV HR Platform - Docker Compose Configuration
# Version: 4.3.0 - MongoDB Atlas Edition
# Updated: January 14, 2026
#
# Uses MongoDB Atlas (cloud) - No local MongoDB container needed!
# This saves disk space and RAM on your computer.
#
# Default services (3 total):
#   - Gateway:          http://localhost:8000 (Main API)
#   - Agent:            http://localhost:9000 (AI Matching)
#   - LangGraph:        http://localhost:9001 (Workflow Engine)
#
# Legacy services (commented out by default):
#   - Portal:           http://localhost:8501 (HR Dashboard - Streamlit)
#   - Client Portal:    http://localhost:8502 (Client Portal - Streamlit)
#   - Candidate Portal: http://localhost:8503 (Candidate Portal - Streamlit)
#
# Frontend: Run separately with `npm run dev` on port 3000
#
# Usage:
#   cd backend && docker-compose -f docker-compose.production.yml up --build
#
# Environment:
#   Loads backend/.env so JWT/API keys match local backend (avoids token mismatch).
#   Run from backend/ so ${VAR} and env_file resolve to backend/.env.
#
# Complete-Infiverse workflow bridge (candidate Tasks tab):
#   Set WORKFLOW_BRIDGE_* in backend/.env. For the gateway container URL, use WORKFLOW_API_BASE_URL_DOCKER
#   (defaults to http://host.docker.internal:5000/api). Plain WORKFLOW_API_BASE_URL=127.0.0.1 is for local uvicorn only.
#
# MongoDB Atlas Connection:
#   Uses DATABASE_URL from .env file pointing to MongoDB Atlas

services:
  # ============================================
  # CORE API SERVICES
  # ============================================

  gateway:
    build: ./services/gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-bhiv_hr}
      API_KEY_SECRET: ${API_KEY_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AGENT_SERVICE_URL: http://agent:9000
      LANGGRAPH_SERVICE_URL: http://langgraph:9001
      CANDIDATE_JWT_SECRET_KEY: ${CANDIDATE_JWT_SECRET_KEY}
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY}
      AGENT_MATCH_TIMEOUT: ${AGENT_MATCH_TIMEOUT:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Complete-Infiverse bridge — do not use WORKFLOW_API_BASE_URL from .env here (127.0.0.1 breaks inside Docker)
      WORKFLOW_API_BASE_URL: ${WORKFLOW_API_BASE_URL_DOCKER:-http://host.docker.internal:5000/api}
      WORKFLOW_BRIDGE_EMAIL: ${WORKFLOW_BRIDGE_EMAIL:-}
      WORKFLOW_BRIDGE_PASSWORD: ${WORKFLOW_BRIDGE_PASSWORD:-}
      WORKFLOW_USER_PASSWORD: ${WORKFLOW_USER_PASSWORD:-}
      WORKFLOW_TOKEN_REFRESH_SECONDS: ${WORKFLOW_TOKEN_REFRESH_SECONDS:-43200}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - bhiv-network

  agent:
    build: ./services/agent
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-bhiv_hr}
      API_KEY_SECRET: ${API_KEY_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CANDIDATE_JWT_SECRET_KEY: ${CANDIDATE_JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Hugging Face Configuration
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_SYMLINKS_WARNING: ${HF_HUB_DISABLE_SYMLINKS_WARNING:-1}
      HF_HUB_DISABLE_TELEMETRY: ${HF_HUB_DISABLE_TELEMETRY:-1}
      HF_HUB_DISABLE_PROGRESS_BARS: ${HF_HUB_DISABLE_PROGRESS_BARS:-1}
      TRANSFORMERS_VERBOSITY: ${TRANSFORMERS_VERBOSITY:-error}
      TOKENIZERS_PARALLELISM: ${TOKENIZERS_PARALLELISM:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - bhiv-network

  langgraph:
    build: ./services/langgraph
    ports:
      - "9001:9001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-bhiv_hr}
      API_KEY_SECRET: ${API_KEY_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CANDIDATE_JWT_SECRET_KEY: ${CANDIDATE_JWT_SECRET_KEY}
      GATEWAY_SERVICE_URL: http://gateway:8000
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      GMAIL_EMAIL: ${GMAIL_EMAIL}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-pro}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - bhiv-network

