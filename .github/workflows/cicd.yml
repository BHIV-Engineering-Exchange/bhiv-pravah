name: Pravah CI/CD

on:
  push:
    branches: [main]

jobs:

  # ================================================================
  # BUILD + TEST + PUSH
  # Builds the single shared "pravah" image from ./pravah-bhiv/backend/Dockerfile,
  # smoke-tests it locally (redis + control-plane + decision-brain +
  # observer wired together, same as prod), then pushes to Docker Hub.
  # ================================================================
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./pravah-bhiv/backend
          file: ./pravah-bhiv/backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/pravah:${{ steps.vars.outputs.image_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/pravah:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        env:
          IMG: ${{ secrets.DOCKER_HUB_USERNAME }}/pravah:${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail

          docker network create pravah-test-net

          echo "Starting redis..."
          docker run -d --name test-redis --network pravah-test-net redis:7-alpine
          timeout 60 bash -c 'until docker exec test-redis redis-cli ping; do sleep 3; done'

          echo "Starting control-plane..."
          docker run -d --name test-control-plane --network pravah-test-net \
            -e REDIS_HOST=test-redis -e REDIS_PORT=6379 -e PORT=7000 \
            -e SSPL_SECRET_KEY=test -e LINEAGE_SIGNING_KEY=test \
            -p 7001:7000 "$IMG" \
            gunicorn wsgi:app --workers 1 --worker-class sync --bind 0.0.0.0:7000 --timeout 120

          echo "Starting decision-brain..."
          docker run -d --name test-decision-brain --network pravah-test-net \
            -e REDIS_HOST=test-redis -e REDIS_PORT=6379 -e PORT=8000 \
            -e SSPL_SECRET_KEY=test -e LINEAGE_SIGNING_KEY=test \
            -p 8010:8000 "$IMG" \
            uvicorn control_plane.backend.app.main:app --host 0.0.0.0 --port 8000 --workers 1

          echo "Starting observer..."
          docker run -d --name test-observer --network pravah-test-net \
            -e PRAVAH_CONTROL_PLANE=http://test-control-plane:7000 \
            -e PRAVAH_MAIN_API=http://test-decision-brain:8000 \
            -p 8602:8600 "$IMG" \
            uvicorn observer_server:app --host 0.0.0.0 --port 8600

          echo "Starting deploy worker..."
          docker run -d --name test-deploy-worker --network pravah-test-net \
            -e REDIS_HOST=test-redis -e REDIS_PORT=6379 \
            -e PYTHONUNBUFFERED=1 -e PYTHONPATH=/app -e ENVIRONMENT=dev \
            "$IMG" \
            python -m control_plane.agents.multi_deploy_agent --env dev --workers 1

          echo "Waiting on control-plane health..."
          timeout 90 bash -c 'until curl -fs http://localhost:7001/api/health; do sleep 5; done'

          echo "Waiting on decision-brain health..."
          timeout 90 bash -c 'until curl -fs http://localhost:8010/health; do sleep 5; done'

          echo "Checking decision-brain metrics..."
          timeout 90 bash -c 'until curl -fs http://localhost:8010/metrics | grep -q pravah_decision_brain_up; do sleep 5; done'

          echo "Waiting on observer health..."
          timeout 90 bash -c 'until curl -fs http://localhost:8602/health; do sleep 5; done'

          echo "Checking deploy worker is still alive..."
          sleep 12
          docker inspect -f '{{.State.Running}}' test-deploy-worker | grep -q true

          echo "All smoke checks passed."

      - name: Tear down test containers
        if: always()
        run: |
          docker rm -f test-control-plane test-decision-brain test-observer test-deploy-worker test-redis 2>/dev/null || true
          docker network rm pravah-test-net 2>/dev/null || true

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/pravah:${{ steps.vars.outputs.image_tag }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/pravah:latest

  # ================================================================
  # DEPLOY
  # Copies only docker-compose.prod.yml + env files to the VM,
  # then pulls the freshly pushed tag and brings the stack up.
  # ================================================================
  deploy:
    needs: build

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: ${{ secrets.PROD_VM_USER }}
          password: ${{ secrets.PROD_VM_PASSWORD }}
          port: ${{ secrets.PROD_VM_PORT }}
          script: |
            set -e
            DEPLOY_DIR="/PRAVAH"

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R $USER:$USER "$DEPLOY_DIR"

            # Clean up stray copies left over from earlier pipeline runs
            # (before the SCP source/strip_components paths were fixed).
            # Safe to remove — these are never the real deploy location.
            rm -rf "$DEPLOY_DIR/backend" "$DEPLOY_DIR/pravah-bhiv"

            # Pre-create bind-mount targets owned by UID 1000 (the "pravah"
            # user the container runs as — see Dockerfile). Without this,
            # Docker auto-creates ./logs and ./data as root on first mount,
            # and gunicorn (running as UID 1000 inside the container) can't
            # write to them, which fails the healthcheck immediately.
            mkdir -p "$DEPLOY_DIR/logs" "$DEPLOY_DIR/data"
            sudo chown -R 1000:1000 "$DEPLOY_DIR/logs" "$DEPLOY_DIR/data"

            echo "Deployment directory is ready."

      - name: Copy docker-compose file and backend code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: ${{ secrets.PROD_VM_USER }}
          password: ${{ secrets.PROD_VM_PASSWORD }}
          port: ${{ secrets.PROD_VM_PORT }}
          source: "pravah-bhiv/backend/docker-compose.prod.yml,pravah-bhiv/backend/monitoring"
          target: "/PRAVAH/"
          strip_components: 2

      - name: Verify copied files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: ${{ secrets.PROD_VM_USER }}
          password: ${{ secrets.PROD_VM_PASSWORD }}
          port: ${{ secrets.PROD_VM_PORT }}
          script: |
            find /PRAVAH -maxdepth 2 -type f

      - name: Create environment files
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: ${{ secrets.PROD_VM_USER }}
          password: ${{ secrets.PROD_VM_PASSWORD }}
          port: ${{ secrets.PROD_VM_PORT }}
          script: |
            set -euo pipefail
            cd /PRAVAH

            mkdir -p environments

            cat > environments/dev.env << 'ENVEOF'
            ${{ secrets.DEV_ENV }}
            ENVEOF

            cat > environments/prod.env << 'ENVEOF'
            ${{ secrets.PROD_ENV }}
            ENVEOF

            cat > environments/stage.env << 'ENVEOF'
            ${{ secrets.STAGE_ENV }}
            ENVEOF

            chmod 600 environments/*.env

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0

        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          VM_IP: ${{ secrets.VM_IP }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          SSPL_SECRET_KEY: ${{ secrets.SSPL_SECRET_KEY }}
          LINEAGE_SIGNING_KEY: ${{ secrets.LINEAGE_SIGNING_KEY }}

        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: ${{ secrets.PROD_VM_USER }}
          password: ${{ secrets.PROD_VM_PASSWORD }}
          port: ${{ secrets.PROD_VM_PORT }}

          envs: IMAGE_TAG,VM_IP,DOCKER_HUB_USERNAME,SSPL_SECRET_KEY,LINEAGE_SIGNING_KEY

          script: |
            set -euo pipefail

            DEPLOY_DIR="/PRAVAH"

            cd "$DEPLOY_DIR"
            echo "Current directory:"
            pwd
            echo "Files:"
            ls -lah

