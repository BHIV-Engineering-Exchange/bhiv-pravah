name: Production Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate production deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GitHub SHA
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Generate Compose file for validation
        run: |
          sed "s|IMG_TAG|$short_sha|g" docker-compose.production.template.yml > docker-compose.production.yml

      - name: Create stub .env for compose validation
        run: |
          # Docker Compose config requires the env_file to exist to parse the schema.
          # We use stubs here — real secrets are injected at deploy time via GitHub secrets.
          touch .env

      - name: Validate Docker Compose file
        env:
          POSTGRES_PASSWORD: stub
          REDIS_PASSWORD: stub
          MONGO_PASSWORD: stub
          JWT_SECRET: stub_stub_stub_stub_stub_stub_stub_stub
          SESSION_SECRET: stub
          ENCRYPTION_KEY: stub
          API_KEY: stub
          ETHEREUM_RPC_URL: stub
          SOLANA_RPC_URL: stub
        run: |
          docker compose -f docker-compose.production.yml config

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: |
            docker-compose.production.template.yml

  build:
    name: Build production images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push blockchain node image
        run: |
          docker buildx build --push \
            --tag bhiv/blackhole-node:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-node:latest \
            -f deploy/mainnet/Dockerfile.blockchain .

      - name: Build and push bridge image
        run: |
          docker buildx build --push \
            --tag bhiv/blackhole-bridge:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-bridge:latest \
            -f bridge-sdk/Dockerfile.bridge bridge-sdk

      - name: Build and push wallet image
        run: |
          docker buildx build --push \
            --tag bhiv/blackhole-wallet:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-wallet:latest \
            -f services/wallet/Dockerfile services/wallet

      - name: Build and push fraud image
        run: |
          docker buildx build --push \
            --tag bhiv/blackhole-fraud:${{ steps.vars.outputs.sha_short }} \
            --tag bhiv/blackhole-fraud:latest \
            -f Dockerfile.tantra .

  deploy:
    name: Deploy to remote production VM via SSH
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts

      - name: Create .env file from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Tar deployment files
        run: |
          tar -czf deployment.tar.gz docker-compose.production.template.yml .env

      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create BLACKHOLE directory on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "mkdir -p ~/BLACKHOLE"

      - name: Copy deployment tarball to VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" scp -P ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no deployment.tar.gz ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }}:~/BLACKHOLE/deployment.tar.gz

      - name: Deploy production stack on VM
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE

            # Clean directory first, keeping docs folder (Release History) and the tarball we just copied
            find . -mindepth 1 ! -name docs ! -path './docs/*' ! -name deployment.tar.gz -exec rm -rf {} +

            # Extract deployment archive and clean up tarball
            tar -xzf deployment.tar.gz
            rm -f deployment.tar.gz

            # Confirm Docker availability
            docker version
            docker compose version

            # Log in to Docker Hub on the VM to authenticate for private pulls
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Restore persistent Release History
            mkdir -p docs
            if [ -f /var/tmp/BLACKHOLE/RELEASE_HISTORY.md ]; then
              cp /var/tmp/BLACKHOLE/RELEASE_HISTORY.md docs/RELEASE_HISTORY.md
            fi

            # Generate target compose file from template by substituting the image tag
            sed "s|IMG_TAG|${{ needs.build.outputs.sha_short }}|g" docker-compose.production.template.yml > docker-compose.production.yml

            # Validate compose config before deploy
            docker compose -f docker-compose.production.yml config

            # Pull all production images
            docker compose -f docker-compose.production.yml pull

            # Log out from Docker Hub to secure credentials on the VM
            docker logout

            # Deploy production stack
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            # Verify deployment status
            docker compose -f docker-compose.production.yml ps

            # Health Check — wait for all key services to become healthy (blockchain nodes take longer)
            echo "Waiting for services to be healthy..."
            for i in {1..18}; do
              # Docker compose health filter (with fallback)
              if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q > /dev/null 2>&1; then
                UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
              else
                UNHEALTHY_COUNT=0
                STARTING_COUNT=0
              fi

              # Blockchain node-1 health (primary — all other nodes depend on it)
              NODE1_HEALTH=0
              NODE1_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-node-1 2>/dev/null || echo "missing")
              [ "$NODE1_STATUS" = "healthy" ] && NODE1_HEALTH=1

              # Bridge health
              BRIDGE_HEALTH=0
              BRIDGE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-bridge 2>/dev/null || echo "missing")
              [ "$BRIDGE_STATUS" = "healthy" ] && BRIDGE_HEALTH=1

              # Wallet health
              WALLET_HEALTH=0
              WALLET_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-wallet 2>/dev/null || echo "missing")
              [ "$WALLET_STATUS" = "healthy" ] && WALLET_HEALTH=1

              # Fraud health
              FRAUD_HEALTH=0
              FRAUD_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-fraud 2>/dev/null || echo "missing")
              [ "$FRAUD_STATUS" = "healthy" ] && FRAUD_HEALTH=1

              if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$NODE1_HEALTH" -eq 1 ] && [ "$BRIDGE_HEALTH" -eq 1 ] && [ "$WALLET_HEALTH" -eq 1 ] && [ "$FRAUD_HEALTH" -eq 1 ]; then
                echo "All services are healthy!"
                break
              fi

              if [ "$i" -eq 18 ]; then
                echo "Health check failed after 3 minutes!"
                docker compose -f docker-compose.production.yml ps
                docker compose -f docker-compose.production.yml logs --tail=50
                exit 1
              fi

              echo "Attempt $i/18 — starting=$STARTING_COUNT unhealthy=$UNHEALTHY_COUNT node1=$NODE1_HEALTH bridge=$BRIDGE_HEALTH wallet=$WALLET_HEALTH fraud=$FRAUD_HEALTH. Retrying in 10s..."
              sleep 10
            done

            # Prune old images while preserving recently built ones (last 7 days) to speed up rollbacks
            docker image prune -af --filter "until=168h"
          EOF

      - name: Update Release Documentation on Success
        if: success()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE
            if [ ! -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p docs
              echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
              echo "" >> docs/RELEASE_HISTORY.md
              echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
              echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
            fi
            echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | SUCCESS | Stable deployment |" >> docs/RELEASE_HISTORY.md
          EOF

      - name: Save persistent Release History
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/BLACKHOLE
              cp docs/RELEASE_HISTORY.md /var/tmp/BLACKHOLE/RELEASE_HISTORY.md
            fi
          EOF

  rollback:
    name: Rollback on deployment failure
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Automatic Rollback on Failure
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE

            # Robust parsing of Release History to extract the 7-character hexadecimal SHA column
            if [ -f docs/RELEASE_HISTORY.md ] && grep -qE "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md; then
              LAST_HEALTHY_TAG=$(grep -E "SUCCESS|ROLLBACK_SUCCESS" docs/RELEASE_HISTORY.md | tail -n 1 | awk -F '|' '{
                for(i=1; i<=NF; i++) {
                  gsub(/[[:space:]]/, "", $i);
                  if ($i ~ /^[0-9a-f]{7}$/) {
                    print $i;
                    exit;
                  }
                }
              }')

              if [ -z "$LAST_HEALTHY_TAG" ]; then
                echo "No last healthy tag extracted from Release History. Cannot perform automatic rollback."
                exit 1
              fi

              echo "Deployment failed! Rolling back to last healthy tag: $LAST_HEALTHY_TAG"

              # Re-generate active compose file from original template with the healthy tag
              sed "s|IMG_TAG|$LAST_HEALTHY_TAG|g" docker-compose.production.template.yml > docker-compose.production.yml

              # Log in to Docker Hub on the VM to authenticate for rollback pulls
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

              # Pull last healthy tag
              docker compose -f docker-compose.production.yml pull

              # Log out from Docker Hub to secure credentials on the VM
              docker logout

              # Deploy last healthy tag
              docker compose -f docker-compose.production.yml up -d --remove-orphans

              # Verify deployment status
              docker compose -f docker-compose.production.yml ps

              # Post-Rollback Verification
              echo "Waiting for rollback services to be healthy..."
              for i in {1..18}; do
                if docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q > /dev/null 2>&1; then
                  UNHEALTHY_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=unhealthy" -q | wc -l)
                  STARTING_COUNT=$(docker compose -f docker-compose.production.yml ps --filter "status=running" --filter "health=starting" -q | wc -l)
                else
                  UNHEALTHY_COUNT=0
                  STARTING_COUNT=0
                fi

                NODE1_HEALTH=0
                NODE1_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-node-1 2>/dev/null || echo "missing")
                [ "$NODE1_STATUS" = "healthy" ] && NODE1_HEALTH=1

                BRIDGE_HEALTH=0
                BRIDGE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-bridge 2>/dev/null || echo "missing")
                [ "$BRIDGE_STATUS" = "healthy" ] && BRIDGE_HEALTH=1

                WALLET_HEALTH=0
                WALLET_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-wallet 2>/dev/null || echo "missing")
                [ "$WALLET_STATUS" = "healthy" ] && WALLET_HEALTH=1

                FRAUD_HEALTH=0
                FRAUD_STATUS=$(docker inspect --format='{{.State.Health.Status}}' blackhole-fraud 2>/dev/null || echo "missing")
                [ "$FRAUD_STATUS" = "healthy" ] && FRAUD_HEALTH=1

                if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ] && [ "$NODE1_HEALTH" -eq 1 ] && [ "$BRIDGE_HEALTH" -eq 1 ] && [ "$WALLET_HEALTH" -eq 1 ] && [ "$FRAUD_HEALTH" -eq 1 ]; then
                  echo "Rollback deployment is healthy!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_SUCCESS | Rollback from failed ${{ needs.build.outputs.sha_short }} is healthy |" >> docs/RELEASE_HISTORY.md
                  exit 0
                fi

                if [ "$i" -eq 18 ]; then
                  echo "Rollback health check failed!"
                  echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | $LAST_HEALTHY_TAG | ROLLBACK_FAILED | Rollback from failed ${{ needs.build.outputs.sha_short }} failed health check |" >> docs/RELEASE_HISTORY.md
                  exit 1
                fi

                echo "Attempt $i/18 — starting=$STARTING_COUNT unhealthy=$UNHEALTHY_COUNT node1=$NODE1_HEALTH bridge=$BRIDGE_HEALTH wallet=$WALLET_HEALTH fraud=$FRAUD_HEALTH. Retrying in 10s..."
                sleep 10
              done
            else
              echo "No last healthy tag found in Release History. Cannot perform automatic rollback."
              if [ ! -f docs/RELEASE_HISTORY.md ]; then
                mkdir -p docs
                echo "# Release History and Deployment Registry" > docs/RELEASE_HISTORY.md
                echo "" >> docs/RELEASE_HISTORY.md
                echo "| Timestamp | Image Tag (Git SHA) | Status | Description |" >> docs/RELEASE_HISTORY.md
                echo "|---|---|---|---|" >> docs/RELEASE_HISTORY.md
              fi
              echo "| $(date -u +'%Y-%m-%d %H:%M:%S UTC') | ${{ needs.build.outputs.sha_short }} | FAILED | Deployment failed and no rollback tag was available |" >> docs/RELEASE_HISTORY.md
              exit 1
            fi
          EOF

      - name: Save persistent Release History after rollback
        if: always()
        run: |
          sshpass -p "${{ secrets.VM_PASSWORD }}" ssh -p ${{ secrets.VM_PORT }} -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_IP }} "bash -s" << 'EOF'
            set -euo pipefail
            cd ~/BLACKHOLE
            if [ -f docs/RELEASE_HISTORY.md ]; then
              mkdir -p /var/tmp/BLACKHOLE
              cp docs/RELEASE_HISTORY.md /var/tmp/BLACKHOLE/RELEASE_HISTORY.md
            fi
          EOF
