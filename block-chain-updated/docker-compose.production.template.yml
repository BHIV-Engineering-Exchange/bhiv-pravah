networks:
  blackhole-network:
    driver: bridge
    name: blackhole-network

volumes:
  blockchain-data-1:
    driver: local
  blockchain-logs-1:
    driver: local
  blockchain-data-2:
    driver: local
  blockchain-logs-2:
    driver: local
  blockchain-data-3:
    driver: local
  blockchain-logs-3:
    driver: local
  blockchain-data-4:
    driver: local
  blockchain-logs-4:
    driver: local
  blockchain-data-5:
    driver: local
  blockchain-logs-5:
    driver: local
  bridge-data:
    driver: local
  bridge-logs:
    driver: local
  blockchain_data:
    name: blackhole-blockchain_blockchain_data
    driver: local
  wallet-go-cache:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local

services:

  # ============================================================
  # DATABASE CONTAINERS
  # ============================================================

  postgres:
    image: postgres:15-alpine
    container_name: blackhole-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-blackhole_wallet}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - blackhole-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: blackhole-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - blackhole-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:6
    container_name: blackhole-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # Exposed on standard port 27017 as it is free on host
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-bhxadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB:-blackhole_wallet}
    volumes:
      - mongodb-data:/data/db
    networks:
      - blackhole-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # SECURITY & ANALYTICS CONTAINERS
  # ============================================================

  fraud-service:
    image: bhiv/blackhole-fraud:IMG_TAG
    container_name: blackhole-fraud
    # Port is kept completely internal to the Docker network to avoid host conflict on 9090
    networks:
      - blackhole-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # BLOCKCHAIN NODES (5-Node Cluster)
  # ============================================================

  blockchain-node-1:
    image: bhiv/blackhole-node:IMG_TAG
    container_name: blackhole-node-1
    command: ["./blockchain"]
    ports:
      - "8080:8080"   # Dashboard / API
      - "8545:8545"   # RPC endpoint
      - "30303:3000"  # P2P networking
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HTTP_PORT=8080
      - P2P_PORT=3000
      - NODE_ID=blackhole-node-1
      - SARATHI_URL=http://blackhole-fraud:9090
      - BLOCKCHAIN_IDENTITY_DIR=/data/blockchain
      - PDV_STRICT_MODE=false
      - SARATHI_FAIL_CLOSED=false
      - SIGVERIFY_STRICT_MODE=false
    volumes:
      - blockchain-data-1:/app/data
      - blockchain-logs-1:/app/logs
      - blockchain_data:/data/blockchain
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      fraud-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # BlackHole Blockchain Node 2
  blockchain-node-2:
    image: bhiv/blackhole-node:IMG_TAG
    container_name: blackhole-node-2
    command: ["./blockchain"]
    ports:
      - "8081:8080"   # Dashboard
      - "8546:8545"   # RPC endpoint
      - "30304:3000"  # P2P networking
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HTTP_PORT=8080
      - P2P_PORT=3000
      - NODE_ID=blackhole-node-2
      - SARATHI_URL=http://blackhole-fraud:9090
      - BOOTNODES_HTTP=http://blackhole-node-1:8080/api/p2p/info
      - PDV_STRICT_MODE=false
      - SARATHI_FAIL_CLOSED=false
      - SIGVERIFY_STRICT_MODE=false
    volumes:
      - blockchain-data-2:/app/data
      - blockchain-logs-2:/app/logs
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # BlackHole Blockchain Node 3
  blockchain-node-3:
    image: bhiv/blackhole-node:IMG_TAG
    container_name: blackhole-node-3
    command: ["./blockchain"]
    ports:
      - "8082:8080"   # Dashboard
      - "8547:8545"   # RPC endpoint
      - "30305:3000"  # P2P networking
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HTTP_PORT=8080
      - P2P_PORT=3000
      - NODE_ID=blackhole-node-3
      - SARATHI_URL=http://blackhole-fraud:9090
      - BOOTNODES_HTTP=http://blackhole-node-1:8080/api/p2p/info
      - PDV_STRICT_MODE=false
      - SARATHI_FAIL_CLOSED=false
      - SIGVERIFY_STRICT_MODE=false
    volumes:
      - blockchain-data-3:/app/data
      - blockchain-logs-3:/app/logs
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # BlackHole Blockchain Node 4
  blockchain-node-4:
    image: bhiv/blackhole-node:IMG_TAG
    container_name: blackhole-node-4
    command: ["./blockchain"]
    ports:
      - "8083:8080"   # Dashboard
      - "8548:8545"   # RPC endpoint
      - "30306:3000"  # P2P networking
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HTTP_PORT=8080
      - P2P_PORT=3000
      - NODE_ID=blackhole-node-4
      - SARATHI_URL=http://blackhole-fraud:9090
      - BOOTNODES_HTTP=http://blackhole-node-1:8080/api/p2p/info
      - PDV_STRICT_MODE=false
      - SARATHI_FAIL_CLOSED=false
      - SIGVERIFY_STRICT_MODE=false
    volumes:
      - blockchain-data-4:/app/data
      - blockchain-logs-4:/app/logs
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # BlackHole Blockchain Node 5
  blockchain-node-5:
    image: bhiv/blackhole-node:IMG_TAG
    container_name: blackhole-node-5
    command: ["./blockchain"]
    ports:
      - "8085:8080"   # Dashboard
      - "8549:8545"   # RPC endpoint
      - "30307:3000"  # P2P networking
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HTTP_PORT=8080
      - P2P_PORT=3000
      - NODE_ID=blackhole-node-5
      - SARATHI_URL=http://blackhole-fraud:9090
      - BOOTNODES_HTTP=http://blackhole-node-1:8080/api/p2p/info
      - PDV_STRICT_MODE=false
      - SARATHI_FAIL_CLOSED=false
      - SIGVERIFY_STRICT_MODE=false
    volumes:
      - blockchain-data-5:/app/data
      - blockchain-logs-5:/app/logs
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # BRIDGE SERVICE
  # ============================================================

  bridge:
    image: bhiv/blackhole-bridge:IMG_TAG
    container_name: blackhole-bridge
    command: ["./bridge-sdk"]
    ports:
      - "8084:8084"   # Bridge dashboard & API
      - "9091:9090"   # gRPC & Relay server (9091 on host)
    environment:
      - DOCKER_MODE=true
      - BLOCKCHAIN_API_URL=http://blackhole-node-1:8080
      - WALLET_API_URL=http://blackhole-wallet:9000
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8084
      - RELAY_PORT=9090
      - DATABASE_PATH=/app/data/bridge_v4.db
      - LOG_FILE=/app/logs/bridge.log
      - BLOCKCHAIN_IDENTITY_DIR=/data/blockchain
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
      - blockchain_data:/data/blockchain:ro
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # WALLET SERVICE
  # ============================================================

  wallet:
    image: bhiv/blackhole-wallet:IMG_TAG
    container_name: blackhole-wallet
    ports:
      - "9000:9000"
    environment:
      - DOCKER_MODE=true
      - BLOCKCHAIN_API_URL=http://blackhole-node-1:8080
      - BRIDGE_API_URL=http://blackhole-bridge:8084
      - APP_PORT=9000
      - APP_ENV=production
      - POSTGRES_HOST=blackhole-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-blackhole_wallet}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SSL_MODE=disable
      - REDIS_ADDRESS=blackhole-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - MONGO_URI=mongodb://${MONGO_USERNAME:-bhxadmin}:${MONGO_PASSWORD}@blackhole-mongodb:27017/${MONGO_DB:-blackhole_wallet}?authSource=admin
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-bhxadmin}:${MONGO_PASSWORD}@blackhole-mongodb:27017/${MONGO_DB:-blackhole_wallet}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    networks:
      - blackhole-network
    restart: unless-stopped
    depends_on:
      blockchain-node-1:
        condition: service_healthy
      bridge:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
