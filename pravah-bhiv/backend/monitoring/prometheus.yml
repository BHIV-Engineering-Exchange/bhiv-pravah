global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pravah-control-plane'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:7000']
        labels:
          environment: 'production'
          component: 'control-plane'

  - job_name: 'pravah-observer-server'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['127.0.0.1:8600']
        labels:
          environment: 'production'
          component: 'observability-dashboard'
