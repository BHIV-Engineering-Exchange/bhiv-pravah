version: '3.8'

# ============================================================
# Pravah Production Docker Compose
# Target: Bare-Metal VM (systemd + docker-compose)
# Images: Downloaded from Docker Hub (NOT built locally)
# Profiles:
#   prod    — production services (recommended)
#   staging — staging/testing
# 
# PORT MAPPING:
# Services will use available ports to avoid conflicts
# ============================================================

services:

  # ----------------------------------------------------------
  # Redis Event Bus — shared by all Pravah services
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pravah-redis
    profiles: [prod, staging]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "pravah-redis"
    

  # ----------------------------------------------------------
  # Control Plane API — Flask/Gunicorn (port 7001)
  # Agent runtime, decision endpoint, registry management
  # IMAGE: Downloaded from Docker Hub
  # ----------------------------------------------------------
  control-plane:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-control-plane
    profiles: [prod, staging]
    ports:
      - "${CONTROL_PLANE_PORT:-7001}:7000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-2}
      - PORT=7000
      - SSPL_SECRET_KEY=${SSPL_SECRET_KEY}
      - LINEAGE_SIGNING_KEY=${LINEAGE_SIGNING_KEY}
      - AUTONOMY_DECISIONS_ENABLED=${AUTONOMY_DECISIONS_ENABLED:-true}
      - AUTONOMY_LEARNING_ENABLED=${AUTONOMY_LEARNING_ENABLED:-false}
      - EMERGENCY_FREEZE_ENABLED=${EMERGENCY_FREEZE_ENABLED:-false}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_FREEZE_MODE=${DEMO_FREEZE_MODE:-false}
      - VM_IP=${VM_IP:-localhost}
      - PRAVAH_GURUKUL_API=${PRAVAH_GURUKUL_API:-http://${VM_IP:-localhost}:3000}
      - PRAVAH_HR_API=${PRAVAH_HR_API:-http://${VM_IP:-localhost}:8000}
      - PRAVAH_PARIKSHAK_API=${PRAVAH_PARIKSHAK_API:-http://${VM_IP:-localhost}:8080}
      - PRAVAH_CRM_API=${PRAVAH_CRM_API:-http://${VM_IP:-localhost}:8001}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: >
      gunicorn wsgi:app
      --workers ${GUNICORN_WORKERS:-4}
      --worker-class sync
      --bind 0.0.0.0:7000
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --log-level info
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        tag: "pravah-control-plane"
    

  # ----------------------------------------------------------
  # Decision Brain — FastAPI/Uvicorn (port 8001)
  # Policy engine, RL decision layer, telemetry ingestion
  # ----------------------------------------------------------
  decision-brain:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-decision-brain
    profiles: [prod, staging]
    ports:
      - "${DECISION_BRAIN_PORT:-8010}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-2}
      - PORT=8000
      - SSPL_SECRET_KEY=${SSPL_SECRET_KEY}
      - LINEAGE_SIGNING_KEY=${LINEAGE_SIGNING_KEY}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_FREEZE_MODE=${DEMO_FREEZE_MODE:-false}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-*}
      - VM_IP=${VM_IP:-localhost}
      - PRAVAH_CONTROL_PLANE=${PRAVAH_CONTROL_PLANE:-http://${VM_IP:-localhost}:7000}
      - PRAVAH_MAIN_API=${PRAVAH_MAIN_API:-http://${VM_IP:-localhost}:8010}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: >
      uvicorn control_plane.backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-2}
      --log-level info
      --access-log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        tag: "pravah-decision-brain"
    

  # ----------------------------------------------------------
  # Observer Server — FastAPI/Uvicorn (port 8602)
  # Passive health probing of 20+ registered services
  # ----------------------------------------------------------
  observer:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-observer
    profiles: [prod, staging]
    ports:
      - "${OBSERVER_PORT:-8602}:8600"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PRAVAH_OBSERVER_PORT=8600
      - PRAVAH_CONTROL_PLANE=http://control-plane:7000
      - PRAVAH_MAIN_API=http://decision-brain:8000
      - VM_IP=${VM_IP:-localhost}
      - PRAVAH_CONTROL_PLANE_EXTERNAL=${PRAVAH_CONTROL_PLANE:-http://${VM_IP:-localhost}:7000}
      - PRAVAH_MAIN_API_EXTERNAL=${PRAVAH_MAIN_API:-http://${VM_IP:-localhost}:8010}
      - PRAVAH_OBSERVER=${PRAVAH_OBSERVER:-http://${VM_IP:-localhost}:8600}
      - PRAVAH_PROMETHEUS=${PRAVAH_PROMETHEUS:-http://${VM_IP:-localhost}:9093}
      - PRAVAH_GURUKUL_API=${PRAVAH_GURUKUL_API:-http://${VM_IP:-localhost}:3000}
      - PRAVAH_HR_API=${PRAVAH_HR_API:-http://${VM_IP:-localhost}:8000}
      - PRAVAH_PARIKSHAK_API=${PRAVAH_PARIKSHAK_API:-http://${VM_IP:-localhost}:8080}
      - PRAVAH_CRM_API=${PRAVAH_CRM_API:-http://${VM_IP:-localhost}:8001}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: >
      uvicorn observer_server:app
      --host 0.0.0.0
      --port 8600
      --log-level info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8600/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      control-plane:
        condition: service_healthy
      decision-brain:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "pravah-observer"
    

  # ----------------------------------------------------------
  # Deploy Workers (3 workers for parallel deployments)
  # ----------------------------------------------------------
  deploy-worker-1:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-deploy-worker-1
    profiles: [prod, staging]
    environment:
      - WORKER_ID=1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENVIRONMENT=${ENVIRONMENT:-prod}
    volumes:
      - ./logs:/app/logs
    command: python -m control_plane.agents.multi_deploy_agent --env ${ENVIRONMENT:-prod} --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "pravah-worker-1"
    

  deploy-worker-2:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-deploy-worker-2
    profiles: [prod, staging]
    environment:
      - WORKER_ID=2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENVIRONMENT=${ENVIRONMENT:-prod}
    volumes:
      - ./logs:/app/logs
    command: python -m control_plane.agents.multi_deploy_agent --env ${ENVIRONMENT:-prod} --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "pravah-worker-2"
    

  deploy-worker-3:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-deploy-worker-3
    profiles: [prod, staging]
    environment:
      - WORKER_ID=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ENVIRONMENT=${ENVIRONMENT:-prod}
    volumes:
      - ./logs:/app/logs
    command: python -m control_plane.agents.multi_deploy_agent --env ${ENVIRONMENT:-prod} --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        tag: "pravah-worker-3"
    

  # ----------------------------------------------------------
  # Queue Monitor
  # ----------------------------------------------------------
  queue-monitor:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-queue-monitor
    profiles: [prod, staging]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-prod}
    volumes:
      - ./logs:/app/logs
    command: python -m monitoring.queue_monitor --continuous --cycles 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        tag: "pravah-queue-monitor"

  # ----------------------------------------------------------
  # System Health Monitor
  # ----------------------------------------------------------
  health-monitor:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_HUB_USERNAME}/pravah:${PRAVAH_IMAGE_TAG:-latest}
    container_name: pravah-health-monitor
    profiles: [prod, staging]
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-prod}
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
    command: python -m monitoring.infra_health_monitor --env ${ENVIRONMENT:-prod} --continuous
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        tag: "pravah-health-monitor"

  # ----------------------------------------------------------
  # Prometheus Metrics Scraper
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pravah-prometheus
    profiles: [prod, staging]
    ports:
      - "${PROMETHEUS_PORT:-9093}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - control-plane
      - observer
    networks:
      - pravah-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        tag: "pravah-prometheus"

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  pravah-network:
    driver: bridge
    name: pravah-production-network

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  redis_data:
    driver: local
    name: pravah-redis-data
  prometheus_data:
    driver: local
    name: pravah-prometheus-data
