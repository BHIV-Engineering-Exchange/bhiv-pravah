apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mitra-network-policy
  namespace: mitra
spec:
  podSelector:
    matchLabels:
      app: mitra-core
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: mitra
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: mitra
      ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
