apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mitra-ingress
  namespace: mitra
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  rules:
    - host: mitra.bhiv.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mitra-core
                port:
                  number: 80
  tls:
    - hosts:
        - mitra.bhiv.example.com
      secretName: mitra-tls-secret
